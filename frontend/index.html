<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <script>
      (() => {
        try {
          const savedDarkMode = localStorage.getItem('darkMode');
          const savedTheme =
            localStorage.getItem('theme') ||
            localStorage.getItem('color-theme');

          const isDark =
            savedDarkMode === 'true' ||
            savedTheme === 'dark' ||
            (savedDarkMode === null &&
              savedTheme === null &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);

          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark
            ? 'dark'
            : 'light';

          document.documentElement.style.backgroundColor = isDark
            ? '#020617'
            : '#f8fafc';
        } catch {
          document.documentElement.style.backgroundColor = '#f8fafc';
        }
      })();
    </script>

    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      html {
        background: #f8fafc;
      }

      html.dark {
        background: #020617;
      }

      body {
        background: inherit;
      }
    </style>

    <link id="favicon" rel="icon" type="image/png" href="/light-mode.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="ZUNY - giao diện luyện thi THPT và E-Learning hiện đại."
    />

    <!-- KHÔNG flash light mode khi reload -->
    <script>
      (() => {
        const darkMode = localStorage.getItem('darkMode') === 'true';

        if (darkMode) {
          document.documentElement.classList.add('dark');

          const favicon = document.getElementById('favicon');

          if (favicon) {
            favicon.setAttribute('href', '/dark-mode.png');
          }
        } else {
          document.documentElement.classList.remove('dark');

          const favicon = document.getElementById('favicon');

          if (favicon) {
            favicon.setAttribute('href', '/light-mode.png');
          }
        }
      })();
    </script>

    <title>ZUNY | Luyện thi THPT</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
